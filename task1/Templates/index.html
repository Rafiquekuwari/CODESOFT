<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC College Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-top: 20px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
        }
        .response {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>ABC College Enquiry Chatbot</h1>
    <form method="POST">
        <input type="text" name="user_input" placeholder="Ask something about ABC College..." required>
        <br>
        <button type="submit">Ask</button>
    </form>

    {% if response %}
    <div class="response">
        <p>Bot: {{ response }}</p>
    </div>
    {% endif %}
</div>
</body>
</html>
